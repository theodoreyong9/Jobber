<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobber — Personal Interoperable Agency</title>
<meta name="description" content="Local-first, peer-to-peer personal agency. No backend, no central database.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="theme-color" content="#0D1114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <div class="main">
    <header class="topbar">
      <div class="who" id="topbarWho"></div>
      <div class="controls" id="topbarControls"></div>
    </header>

    <section class="workspace" id="workspace"></section>
  </div>

  <footer class="modebar">
    <div class="modebar-side">
      <span class="stat" title="WebRTC peer connections across every live search"><b id="peerCount">0</b> peers</span>
      <span class="stat" id="webgpuFlag"></span>
    </div>
    <button type="button" class="brand-mini" title="Bureau"><span class="dot"></span>Jobber</button>
    <a class="github-link" href="https://github.com/theodoreyong9/Jobber" target="_blank" rel="noopener" title="Jobber on GitHub" aria-label="Jobber on GitHub">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.02-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
    <div class="modebar-side modebar-side-right">
      <span class="stat" id="swFlag"></span>
      <details class="settings-details">
        <summary title="Storage, network status, and backup">⚙</summary>
        <div class="settings-panel">
          <div class="row"><span>Storage</span><b>IndexedDB</b></div>
          <div class="row"><span>Backend</span><b>none</b></div>
          <div class="row"><span>Protocol</span><b>v0.4</b></div>
          <div class="row"><span>Local footprint</span><b id="usageStat">…</b></div>
          <div class="backup-actions">
            <button class="btn small ghost" id="exportBackup" title="Download everything (identities, profiles, blocklist, Intelligence projects) as one JSON file">Export backup</button>
            <button class="btn small ghost" id="importBackup" title="Restore from a previously exported backup file">Import backup</button>
            <input type="file" id="importBackupFile" accept=".json,application/json" style="display:none">
          </div>
        </div>
      </details>
    </div>
  </footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
