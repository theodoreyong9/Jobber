<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jobber</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Jobber</h1>
      <p class="tagline">Adapt your CV. No account needed.</p>
    </header>

    <main>
      <label class="file-drop">
        <input type="file" id="cv-file" accept=".docx" />
        <span id="file-name">Charger ton CV (.docx)</span>
      </label>

      <div id="job-list"></div>
      <div class="job-controls">
        <button id="add-job-btn" type="button" class="secondary-btn">+ Ajouter une offre</button>
        <span id="job-count" class="hint">Aucune offre collée</span>
      </div>

      <select id="model-select" aria-label="Modèle">
        <option value="auto">Modèle : Auto</option>
        <option value="small">Modèle : Petit</option>
        <option value="medium">Modèle : Moyen</option>
        <option value="large">Modèle : Grand</option>
      </select>

      <button id="run-btn" disabled>Adapter mon CV</button>
      <button id="stop-btn" type="button" class="secondary-btn" hidden>Stop</button>
      <div class="progress-outer"><div id="progress-bar" class="progress-inner"></div></div>
      <p id="status" class="status">Charge un CV et colle une offre pour commencer.</p>

      <div id="download-area"></div>

      <details>
        <summary>Journal technique</summary>
        <pre id="log"></pre>
      </details>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
