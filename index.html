<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobber — Personal Interoperable Agency</title>
<meta name="description" content="Local-first, peer-to-peer personal agency. No backend, no central database.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="theme-color" content="#0D1114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <header class="modebar">
    <div class="brand-mini" title="Back to the Bureau"><span class="dot"></span>Jobber</div>
    <div class="statusbar">
      <span><b id="peerCount">0</b> peers connected · WebRTC</span>
      <span id="webgpuFlag"></span>
      <span class="flag" id="swFlag"></span>
      <details class="settings-details">
        <summary title="Storage, network status, and backup">⚙</summary>
        <div class="settings-panel">
          <div class="row"><span>Storage</span><b>IndexedDB</b></div>
          <div class="row"><span>Backend</span><b>none</b></div>
          <div class="row"><span>Protocol</span><b>v0.4</b></div>
          <div class="row"><span>Local footprint</span><b id="usageStat">…</b></div>
          <div class="backup-actions">
            <button class="btn small ghost" id="exportBackup" title="Download everything (identities, profiles, blocklist, Intelligence projects) as one JSON file">Export backup</button>
            <button class="btn small ghost" id="importBackup" title="Restore from a previously exported backup file">Import backup</button>
            <input type="file" id="importBackupFile" accept=".json,application/json" style="display:none">
          </div>
        </div>
      </details>
    </div>
  </header>

  <div class="main">
    <header class="topbar">
      <div class="who" id="topbarWho"></div>
      <div class="controls" id="topbarControls"></div>
    </header>

    <section class="workspace" id="workspace"></section>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
