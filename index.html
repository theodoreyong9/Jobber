<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobber — matching emploi local & P2P</title>
  <meta name="description" content="Mise en relation candidats / recruteurs, analyse locale, aucun compte, aucun cloud." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./public/icons/icon-192.png" />
  <meta name="theme-color" content="#16211D" />
  <link rel="stylesheet" href="./src/ui/style.css" />

  <!-- Résolution des dépendances via CDN (aucun bundler requis en V1, §4).
       On importe le paquet racine `trystero` (Nostr par défaut) — le
       sous-chemin `trystero/nostr` est un alias de compatibilité déprécié
       dont le comportement s'est révélé peu fiable en pratique.
       mammoth.js est chargé séparément via un tag <script> injecté au
       moment où un .docx est lu (voir src/app/main.js). -->
  <script type="importmap">
  {
    "imports": {
      "trystero": "https://esm.run/trystero"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <span class="topbar-mark" aria-hidden="true">◐</span>
    <h1 class="topbar-title">Jobber</h1>
    <span class="topbar-sub">local · P2P · sans compte</span>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <aside id="log-panel" class="log-panel" hidden>
    <div class="log-panel-head">
      <span>Journal technique</span>
      <button id="log-toggle" class="link-button" type="button">masquer</button>
    </div>
    <ul id="log-list" class="log-list"></ul>
  </aside>
  <button id="log-open" class="log-open" type="button" title="Journal technique">⋮</button>

  <script type="module" src="./src/app/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const base = document.querySelector('link[rel="manifest"]').href.replace('manifest.webmanifest', '');
        navigator.serviceWorker.register(base + 'service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
